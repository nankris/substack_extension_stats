<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Quire</title>
  <link rel="stylesheet" href="../js/tokens.css" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="popup">
    <header class="popup-header">
      <div class="brand">
        <img src="../icons/icon48.png" alt="" width="20" height="20" />
        <span class="brand-name">Quire</span>
      </div>
      <button class="btn btn-ghost icon-btn" id="openDashboardTop" title="Open full dashboard" aria-label="Open full dashboard">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M6 3H3.5A1.5 1.5 0 0 0 2 4.5v8A1.5 1.5 0 0 0 3.5 14h8a1.5 1.5 0 0 0 1.5-1.5V10M10 2h4v4M13.5 2.5 7 9" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </header>

    <div class="stat-strip" id="statStrip">
      <div class="stat">
        <span class="stat-num" id="statTotal">–</span>
        <span class="stat-label">Total</span>
      </div>
      <div class="stat">
        <span class="stat-num" id="statFree">–</span>
        <span class="stat-label">Free</span>
      </div>
      <div class="stat">
        <span class="stat-num" id="statPaid">–</span>
        <span class="stat-label">Paid</span>
      </div>
      <div class="stat">
        <span class="stat-num" id="statFav">–</span>
        <span class="stat-label">Favorites</span>
      </div>
    </div>

    <div class="search-row">
      <input type="search" id="quickSearch" placeholder="Search your newsletters…" aria-label="Search newsletters" />
    </div>

    <div class="popup-section">
      <div class="section-heading">Recent</div>
      <ul class="mini-list" id="recentList" aria-live="polite"></ul>
      <p class="empty-note" id="recentEmpty" hidden>Nothing here yet.</p>
    </div>

    <footer class="popup-footer">
      <button class="btn btn-primary" id="openDashboard">Open Dashboard</button>
    </footer>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
